##### TT-RSS DATABASE (postgresql) #####

- name: install packages for postgresql support
  apt:
    state: present
    package:
      - "php{{ tt_rss_php_fpm_version }}-pgsql"
      - python3-psycopg2
  ignore_errors: "{{ ansible_check_mode }}"

- name: create tt-rss postgresql user
  become: yes
  become_user: postgres
  postgresql_user:
    name: "{{ tt_rss_db_user }}"
    state: present
  ignore_errors: "{{ ansible_check_mode }}"

- name: set tt-rss postgresql user password
  become: yes
  become_user: postgres
  postgresql_user:
    name: "{{ tt_rss_db_user }}"
    password: "{{ tt_rss_db_password }}"
  no_log: True
  ignore_errors: "{{ ansible_check_mode }}"

- name: create tt-rss postgresql database
  become: yes
  become_user: postgres
  postgresql_db:
    name: "{{ tt_rss_db_name }}"
    state: present
    encoding: 'UNICODE'
    owner: '{{ tt_rss_db_user }}'
  ignore_errors: "{{ ansible_check_mode }}"

- name: grant privileges on tt-rss database to tt-rss postgresql user
  become: yes
  become_user: postgres
  postgresql_privs:
    login_db: "{{ tt_rss_db_name }}"
    privs: ALL
    type: database
    role: "{{ tt_rss_db_user }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: refresh PostgreSQL collation version for tt-rss database
  become: yes
  become_user: postgres
  command: psql -d ttrss -c "ALTER DATABASE ttrss REFRESH COLLATION VERSION;"
  changed_when: true # always returns changed but only runs once
  when: not (ansible_local.tt_rss.postgresql_collation_refresh_done | default(false))
  ignore_errors: "{{ ansible_check_mode }}"
