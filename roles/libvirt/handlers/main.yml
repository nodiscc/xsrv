- name: restart libvirt networks (stop)
  community.libvirt.virt_net:
    name: "{{ item.name }}"
    command: destroy
  with_items: "{{ libvirt_networks }}"
  when: (item.state is not defined) or (item.state in ['active', 'present'])
  ignore_errors: "{{ ansible_check_mode }}"

- name: restart libvirt networks (start)
  community.libvirt.virt_net:
    name: "{{ item.name }}"
    command: create
  with_items: "{{ libvirt_networks }}"
  when: (item.state is not defined) or (item.state in ['active', 'present'])
  ignore_errors: "{{ ansible_check_mode }}"

- name: restart libvirt storage pools (stop)
  community.libvirt.virt_pool:
    name: "{{ item.name }}"
    command: destroy
  with_items: "{{ libvirt_storage_pools }}"
  when: (item.state is not defined) or (item.state in ['active', 'present'])
  ignore_errors: "{{ ansible_check_mode }}"

- name: restart libvirt storage pools (start)
  community.libvirt.virt_pool:
    name: "{{ item.name }}"
    command: create
  with_items: "{{ libvirt_storage_pools }}"
  when: (item.state is not defined) or (item.state in ['active', 'present'])
  ignore_errors: "{{ ansible_check_mode }}"

- name: reset ssh connection
  meta: reset_connection
