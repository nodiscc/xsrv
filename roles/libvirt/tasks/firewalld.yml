- name: create directory for firewalld systemd overrides
  file:
    state: directory
    path: /etc/systemd/system/firewalld.service.d/
    owner: root
    group: root
    mode: "0755"

- name: configure firewalld drop-in to re-apply libvirt DNAT rules after restart
  template:
    src: etc_systemd_system_firewalld.service.d_libvirt-dnat-reconnect.conf.j2
    dest: /etc/systemd/system/firewalld.service.d/libvirt-dnat-reconnect.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd unit files
    - restart firewalld
