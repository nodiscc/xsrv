- name: install dovecot
  apt:
    state: present
    package:
      - dovecot-core
      - dovecot-imapd
      - dovecot-ldap

- name: create dovecot directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: dovecot
    mode: "0770"
  with_items:
    - "/var/mail/vhosts"

- name: deploy dovecot.conf for Debian 13 (Trixie)
  template:
    src: etc_dovecot_dovecot.conf.j2
    dest: /etc/dovecot/dovecot.conf
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts.distribution_release == "trixie"
  notify: restart dovecot
  ignore_errors: "{{ ansible_check_mode }}"

- name: copy dovecot configuration
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0644') }}"
  with_items:
    - { src: etc_dovecot_conf.d_10-mail.conf.j2, dest: /etc/dovecot/conf.d/10-mail.conf }
    - { src: etc_dovecot_conf.d_10-master.conf.j2, dest: /etc/dovecot/conf.d/10-master.conf }
    - { src: etc_dovecot_conf.d_10-auth.conf.j2, dest: /etc/dovecot/conf.d/10-auth.conf }
    - { src: etc_dovecot_conf.d_10-logging.conf.j2, dest: /etc/dovecot/conf.d/10-logging.conf }
    - { src: etc_dovecot_conf.d_10-ssl.conf.j2, dest: /etc/dovecot/conf.d/10-ssl.conf }
  notify: restart dovecot
  ignore_errors: "{{ ansible_check_mode }}"

- name: deploy auth-ldap.conf.ext for Debian 13 (Trixie)
  template:
    src: etc_dovecot_conf.d_auth-ldap.conf.ext.j2
